<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ZPocket 工作原理：手机经云端中继遥控桌面，产物经 file 通道下载，更新经自有服务器分发</title>
  <desc id="arch-desc">系统图：手机上的 ZPocket 通过云端中继（WSS V4 会话与 file 通道）连接桌面端 ZCode；应用更新清单与 APK 由自有服务器 nghqqa.cn 分发。</desc>

  <rect width="1200" height="380" fill="#060A09"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">

    <!-- 手机节点 -->
    <g transform="translate(70 96)">
      <rect width="270" height="168" rx="16" fill="#0D1210" stroke="#1D2B24"/>
      <text x="28" y="46" font-size="26" font-weight="600" fill="#F2F5F3">手机 · ZPocket</text>
      <text x="28" y="86" font-size="19" fill="#8FA89B">任务 · 会话 · 审批</text>
      <text x="28" y="118" font-size="19" fill="#8FA89B">产物下载 → Downloads/ZPocket</text>
      <text x="28" y="150" font-size="17" fill="#5C6E64">Android 7.0+ · Apache-2.0</text>
    </g>

    <!-- 云端节点 -->
    <g transform="translate(468 96)">
      <rect width="264" height="168" rx="16" fill="#0D1210" stroke="#1D2B24"/>
      <text x="26" y="46" font-size="26" font-weight="600" fill="#F2F5F3">云端中继</text>
      <text x="26" y="86" font-size="19" fill="#8FA89B">WSS V4 会话（RPC 帧）</text>
      <text x="26" y="118" font-size="19" fill="#8FA89B">file 通道 · stat / readFileRange</text>
      <text x="26" y="150" font-size="17" fill="#5C6E64">配对：账号 JWT / 扫码</text>
    </g>

    <!-- 桌面节点 -->
    <g transform="translate(866 96)">
      <rect width="264" height="168" rx="16" fill="#0D1210" stroke="#1D2B24"/>
      <text x="26" y="46" font-size="26" font-weight="600" fill="#F2F5F3">桌面 · ZCode</text>
      <text x="26" y="86" font-size="19" fill="#8FA89B">Agent 任务执行</text>
      <text x="26" y="118" font-size="19" fill="#8FA89B">产物文件（工作区内）</text>
      <text x="26" y="150" font-size="17" fill="#5C6E64">Windows / macOS / Linux</text>
    </g>

    <!-- 会话控制流（上弧）：手机 ⇄ 中继 ⇄ 桌面 -->
    <path d="M 210 96 C 210 40, 470 40, 585 88" stroke="#2FD08F" stroke-width="2.5" fill="none" opacity="0.85"/>
    <path d="M 655 96 C 680 40, 900 40, 990 88" stroke="#2FD08F" stroke-width="2.5" fill="none" opacity="0.85"/>
    <text x="238" y="62" font-size="19" fill="#2FD08F">V4 会话 / 审批</text>
    <text x="712" y="62" font-size="19" fill="#2FD08F">RPC 帧</text>

    <!-- 文件下载流（下弧）：桌面 → 手机 -->
    <path d="M 1000 272 C 920 316, 420 312, 240 274" stroke="#7FB8A4" stroke-width="2.5" fill="none" stroke-dasharray="8 7" opacity="0.9"/>
    <path d="M 252 282 L 234 272 L 252 264" stroke="#7FB8A4" stroke-width="2.5" fill="none"/>
    <text x="430" y="302" font-size="19" fill="#7FB8A4">产物字节流（分段 · 校验）</text>
  </g>

  <!-- 更新通道（独立分隔带） -->
  <g transform="translate(70 340)">
    <rect width="1060" height="30" rx="15" fill="#0D1210"/>
    <circle cx="30" cy="15" r="5" fill="#2FD08F"/>
    <text x="52" y="21" font-size="18" fill="#8FA89B">应用更新：nghqqa.cn 分发清单与 APK → 应用内检查 / 下载 / 安装（自建通道，不依赖第三方）</text>
  </g>
</svg>
