<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ZPocket — ZCode 桌面端的安卓伴侣客户端</title>
  <desc id="hero-desc">深色底上，绿色折带 Z 加终端下划线光标的 ZPocket 字标，旁注：Android 7.0+、自建更新通道、Apache-2.0。</desc>

  <defs>
    <linearGradient id="ribbon-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA97A"/>
      <stop offset="1" stop-color="#0E7A52"/>
    </linearGradient>
    <linearGradient id="ribbon-lo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5C40"/>
      <stop offset="1" stop-color="#0B4530"/>
    </linearGradient>
  </defs>

  <!-- 背景：近黑，带一点点绿相，四角保持纯净深色以适配浅色页面 -->
  <rect width="1200" height="340" fill="#060A09"/>
  <rect width="1200" height="1" y="0" fill="#0F1512"/>

  <!-- 右侧：折带 Z + 下划线光标（图标字标的矢量简化版） -->
  <g id="mark" transform="translate(880 34)">
    <!-- 斜杠氛围线（下划线母题的放大回声，弱化处理） -->
    <rect x="18" y="266" width="150" height="10" rx="5" fill="#0E3A2A" opacity="0.55"/>
    <!-- Z 上横 -->
    <path d="M 56 44 L 190 44 L 214 76 L 80 76 Z" fill="url(#ribbon-hi)"/>
    <!-- Z 对角（深一档，折带暗面） -->
    <path d="M 190 44 L 214 76 L 104 220 L 80 188 Z" fill="#0C5A3E"/>
    <!-- Z 下横 -->
    <path d="M 56 188 L 190 188 L 214 220 L 80 220 Z" fill="url(#ribbon-hi)"/>
    <!-- 高光折线（折带立面的亮边） -->
    <path d="M 80 76 L 190 44" stroke="#3ED49A" stroke-width="3" opacity="0.7" fill="none"/>
    <path d="M 84 186 L 186 192" stroke="#2AA97A" stroke-width="2" opacity="0.45" fill="none"/>
    <!-- 下划线光标：图标同款青绿横杠 -->
    <rect x="196" y="240" width="112" height="12" rx="6" fill="#2FD08F"/>
  </g>

  <!-- 左侧：信息块 -->
  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="21" letter-spacing="6" fill="#2FD08F">ZCODE DESKTOP · ANDROID</text>
    <text x="-4" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="104" font-weight="700" fill="#F2F5F3" letter-spacing="2">ZPocket</text>
    <text x="0" y="242" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="27" fill="#C7D2CB">在手机上接管你的 ZCode 编程智能体</text>
    <!-- 元信息胶囊 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#8FA89B">
      <rect x="0" y="272" width="150" height="36" rx="18" fill="none" stroke="#1D2B24"/>
      <text x="20" y="296">v1.2.2</text>
      <rect x="166" y="272" width="210" height="36" rx="18" fill="none" stroke="#1D2B24"/>
      <text x="186" y="296">Android 7.0+</text>
      <rect x="392" y="272" width="150" height="36" rx="18" fill="none" stroke="#1D2B24"/>
      <text x="412" y="296">Apache-2.0</text>
    </g>
  </g>
</svg>
